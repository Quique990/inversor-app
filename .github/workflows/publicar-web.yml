name: Publicar web

# Publica web/ en GitHub Pages cuando cambia el código de la web.
# (El análisis diario publica por su cuenta tras actualizar los datos.)
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/publicar-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  actions: read
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  empaquetar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web

  desplegar:
    needs: empaquetar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
